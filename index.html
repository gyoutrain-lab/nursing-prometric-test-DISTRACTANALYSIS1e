<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCFHS Nursing Technician Prometric Board Exam Simulator (120 Questions)</title>
    <style>
        :root {
            --primary-color: #004d40;
            --secondary-color: #00796b;
            --accent-color: #0288d1;
            --background-color: #f4f7f9;
            --card-background: #ffffff;
            --text-color: #2c3e50;
            --correct-color: #2e7d32;
            --incorrect-color: #c62828;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-background);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        header {
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .user-info-card {
            background-color: #e0f2f1;
            border: 1px solid #b2dfdb;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .timer-box {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--incorrect-color);
            background: #ffebee;
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid #ffcdd2;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 22px;
            border: 1px solid #e0e0e0;
            border-radius: var(--border-radius);
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #1a252f;
        }

        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            background: #f9f9f9;
            border: 1px solid #dddddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background-color: #e0f7fa;
            border-color: var(--secondary-color);
        }

        .option-label input {
            margin-right: 12px;
            margin-top: 4px;
        }

        .rationale-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            background-color: #e8f5e9;
            border-left: 5px solid var(--correct-color);
            font-size: 0.95rem;
        }

        .rationale-box.incorrect {
            background-color: #ffebee;
            border-left-color: var(--incorrect-color);
        }

        .distractor-analysis {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #444;
            border-top: 1px dashed #bbb;
            padding-top: 8px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #00332c;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .nav-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .results-panel {
            display: none;
            text-align: center;
            padding: 30px;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            background-color: #ffffff;
            margin-bottom: 30px;
        }

        .assessment-badge {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 12px 30px;
            border-radius: 30px;
            margin: 15px 0;
            text-transform: uppercase;
        }

        .status-go {
            background-color: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }

        .status-not-go {
            background-color: #ffcdd2;
            color: #c62828;
            border: 2px solid #c62828;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 10px 0;
        }

        .candidate-summary {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 15px;
            background: #f4f7f9;
            border-radius: 6px;
            text-align: left;
            display: inline-block;
            width: 80%;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            header { flex-direction: column; align-items: flex-start; }
            .candidate-summary { width: 100%; }
            .nav-actions { flex-direction: column-reverse; gap: 10px; align-items: stretch; }
            .nav-actions button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>SCFHS Licensing Examination Simulator</h1>
            <span class="badge">Saudi Commission for Health Specialties - Nursing Technician (120 Questions)</span>
        </div>
        <div class="timer-box" id="timer">Time: 180:00</div>
    </header>

    <!-- Section Validasi Identitas -->
    <div class="user-info-card" id="profile-section">
        <h3 style="margin-top:0; color: var(--primary-color);">Candidate Credentials</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
            <div class="form-group">
                <label for="candidate-name">Full Name (English):</label>
                <input type="text" id="candidate-name" placeholder="e.g., Giyono Asfarrasyid" required>
            </div>
            <div class="form-group">
                <label for="candidate-id">SCFHS Eligibility / Application ID:</label>
                <input type="text" id="candidate-id" placeholder="e.g., SCFHS-2026-883921" required>
            </div>
        </div>
        <button class="btn" style="margin-top: 10px;" onclick="initializeExam()">Start Official Assessment</button>
    </div>

    <!-- Panel Hasil Akhir -->
    <div class="results-panel" id="results-panel">
        <h2>Official SCFHS Assessment Result</h2>
        <div class="candidate-summary" id="candidate-summary-output"></div>
        <div id="assessment-badge-container"></div>
        <div class="score-display" id="score-text">0%</div>
        <p id="pass-fail-details" style="font-size: 1.1rem;"></p>
        <button class="btn" onclick="location.reload()">Retake Assessment</button>
    </div>

    <!-- Kontainer Tampilan Soal Tunggal (Satu per Layar) -->
    <div id="quiz-container" style="display: none;">
        <div class="question-card" id="current-question-card">
            <!-- Isi Soal Diinjeksikan via JS -->
        </div>

        <div class="nav-actions">
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
            <button class="btn" id="rationale-btn" style="background-color: var(--secondary-color);" onclick="toggleRationale()">Show Rationale</button>
        </div>
    </div>
</div>

<script>
    // Bank Soal Utama: 120 Soal Lengkap
    const rawQuestions = [
        {
            id: 1,
            question: "A nursing technician is performing endotracheal suctioning for an intubated patient. During insertion of the suction catheter, the patient's heart rate suddenly drops from 82 bpm to 48 bpm on the bedside monitor. What is the nursing technician's FIRST immediate intervention?",
            options: [
                { text: "Withdraw the catheter completely and hyperoxygenate with 100% O2.", isCorrect: true },
                { text: "Advance the catheter 1 cm further and apply continuous suction.", isCorrect: false },
                { text: "Instill 5 mL of sterile 0.9% normal saline into the endotracheal tube.", isCorrect: false },
                { text: "Notify the registered nurse or physician immediately before stopping.", isCorrect: false }
            ],
            rationale: "Vagal stimulation during endotracheal catheter insertion causes acute bradycardia. The technician must immediately remove the stimulus (withdraw catheter) and provide hyperoxygenation to prevent cardiac arrest.",
            distractorAnalysis: "B: Applying suction worsens hypoxia and vagal tone. C: Saline instillation causes desaturation and infection risks. D: Waiting to notify delays immediate emergency procedure termination."
        },
        {
            id: 2,
            question: "A nursing technician is measuring vital signs on a patient 2 hours post-thyroidectomy. The patient reports feeling 'a tingling sensation around the mouth and fingers.' Which physical assessment check should the technician perform immediately while alerting the staff nurse?",
            options: [
                { text: "Check for Kernig's sign by flexing the patient's thigh at the hip.", isCorrect: false },
                { text: "Inflate a blood pressure cuff on the upper arm to observe for Trousseau's sign.", isCorrect: true },
                { text: "Assess for Babinski reflex on the plantar surface of the foot.", isCorrect: false },
                { text: "Perform a rapid capillary blood glucose fingerstick check.", isCorrect: false }
            ],
            rationale: "Circumoral and digital paresthesia post-thyroidectomy indicates acute hypocalcemia due to accidental parathyroid injury. Trousseau's sign confirms neuromuscular irritability.",
            distractorAnalysis: "A: Kernig's tests for meningeal irritation. C: Babinski assesses upper motor neuron lesions. D: Hypoglycemia causes diaphoresis, not acute carpopedal paresthesia."
        },
        {
            id: 3,
            question: "A nursing technician is preparing to change a transparent dressing over a patient's subclavian Central Venous Catheter (CVC). To maintain maximum aseptic technique and prevent air embolism during the procedure, how should the patient be positioned?",
            options: [
                { text: "High-Fowler's position with head turned toward the insertion site.", isCorrect: false },
                { text: "Prone position with head aligned neutrally with the spine.", isCorrect: false },
                { text: "Trendelenburg position with head turned away from the insertion site.", isCorrect: true },
                { text: "Left lateral recumbent position with feet elevated 30 degrees.", isCorrect: false }
            ],
            rationale: "Trendelenburg position increases central venous pressure in upper body veins, preventing air entry (air embolism) if lines disconnect, while turning the head away prevents site contamination.",
            distractorAnalysis: "A: High-Fowler's lowers venous pressure, increasing air embolism risk. B: Prone position impedes chest expansion. D: Left lateral is used AFTER air embolism occurs."
        },
        {
            id: 4,
            question: "While monitoring a patient receiving a continuous peripheral IV infusion of Potassium Chloride (20 mEq in 500 mL Normal Saline), the technician notes the insertion site is cool, pale, swollen, and the patient reports severe burning pain. What action must the technician take FIRST?",
            options: [
                { text: "Apply a hot compress directly over the site to reduce vascular spasm.", isCorrect: false },
                { text: "Slow the infusion rate to half and re-evaluate in 15 minutes.", isCorrect: false },
                { text: "Elevate the extremity above heart level and massage the tissue.", isCorrect: false },
                { text: "Stop the IV infusion immediately and disconnect the tubing.", isCorrect: true }
            ],
            rationale: "Coolness, swelling, pallor, and burning indicate IV extravasation/infiltration. Immediate cessation of infusion prevents severe tissue necrosis.",
            distractorAnalysis: "A: Heat applied to an extravasated tissue accelerates necrosis. B: Continuing vesicant infusion causes tissue destruction. C: Massaging spreads the toxic solution."
        },
        {
            id: 5,
            question: "A nursing technician is inserting an indwelling Foley catheter in an adult male patient. After inserting the catheter 17 cm, dark yellow urine begins to flow into the tubing. What is the NEXT correct technical step before inflating the retention balloon?",
            options: [
                { text: "Advance the catheter another 2.5 to 5 cm (or up to the bifurcation Y-port).", isCorrect: true },
                { text: "Instill 10 mL of sterile water into the balloon port immediately.", isCorrect: false },
                { text: "Pull back gently on the catheter until resistance is met.", isCorrect: false },
                { text: "Attach the drainage bag to the bedside rail above bladder level.", isCorrect: false }
            ],
            rationale: "In male catheterization, advancing further to the bifurcation ensures the balloon rests inside the bladder cavity before inflation, preventing urethral rupture.",
            distractorAnalysis: "B: Inflating immediately can rupture the male urethra. C: Pulling back is done AFTER inflation. D: Drainage bags must stay BELOW bladder level."
        },
        {
            id: 6,
            question: "A nursing technician is assisting with a patient undergoing a lumbar puncture. Following completion of the procedure, which post-procedural position is most critical for the technician to maintain for the patient to prevent post-dural puncture headache?",
            options: [
                { text: "Reverse Trendelenburg position for 2 hours.", isCorrect: false },
                { text: "Supine flat position (prone or flat) for 4 to 8 hours.", isCorrect: true },
                { text: "Semi-Fowler's position with knees flexed 45 degrees.", isCorrect: false },
                { text: "High-Fowler's position with neck hyperextended.", isCorrect: false }
            ],
            rationale: "Remaining flat supine post-lumbar puncture decreases CSF leakage from the dural puncture site, significantly reducing the incidence of severe low-pressure post-lumbar headache.",
            distractorAnalysis: "A, C, & D: Any head elevation increases spinal fluid gravity pressure gradient, worsening CSF leak and causing severe headache."
        },
        {
            id: 7,
            question: "A nursing technician is obtaining an automated blood pressure reading on a patient post-mastectomy with lymph node dissection of the left arm. The patient has a right-arm arteriovenous (AV) fistula for dialysis. Where should the technician measure the blood pressure?",
            options: [
                { text: "Left upper arm using a manual wrist cuff.", isCorrect: false },
                { text: "Right upper arm proximal to the AV fistula graft.", isCorrect: false },
                { text: "Lower extremity over the popliteal artery/thigh or ankle.", isCorrect: true },
                { text: "Right forearm distal to the vascular anastomosis site.", isCorrect: false }
            ],
            rationale: "BP cuffs are strictly contraindicated on arms with lymph node dissection (risk of lymphedema) and arms with AV fistulas (risk of thrombosis). Lower extremity must be used.",
            distractorAnalysis: "A: Mastectomy side must be avoided due to lymphedema risk. B & D: Cuff pressure on an arm with an AV fistula risks permanent clotting."
        },
        {
            id: 8,
            question: "A technician is caring for a patient on contact and droplet isolation for suspected C. difficile infection and Influenza. When leaving the isolation room, in which precise order should the technician remove personal protective equipment (PPE)?",
            options: [
                { text: "Mask/Respirator -> Gown -> Eye Protection -> Gloves.", isCorrect: false },
                { text: "Gown -> Mask/Respirator -> Eye Protection -> Gloves.", isCorrect: false },
                { text: "Eye Protection -> Gown -> Mask/Respirator -> Gloves.", isCorrect: false },
                { text: "Gloves -> Goggles/Face Shield -> Gown -> Mask/Respirator.", isCorrect: true }
            ],
            rationale: "The standard CDC doffing sequence from most contaminated to least contaminated is: Gloves, Goggles/Face Shield, Gown, and lastly Mask/Respirator.",
            distractorAnalysis: "A, B, & C: Gloves are the most contaminated PPE item and must be removed first to prevent contaminating surrounding clothes or face."
        },
        {
            id: 9,
            question: "A nursing technician is obtaining a 12-lead Electrocardiogram (ECG) for a chest pain patient. Where should the technician correctly place electrode V4?",
            options: [
                { text: "5th intercostal space at the left midclavicular line.", isCorrect: true },
                { text: "4th intercostal space at the right sternal border.", isCorrect: false },
                { text: "4th intercostal space at the left sternal border.", isCorrect: false },
                { text: "5th intercostal space at the left anterior axillary line.", isCorrect: false }
            ],
            rationale: "Lead V4 is placed specifically at the 5th intercostal space in the midclavicular line. Misplacement leads to false ST-segment readings.",
            distractorAnalysis: "B: Location for lead V1. C: Location for lead V2. D: Location for lead V5."
        },
        {
            id: 10,
            question: "A nursing technician is caring for a patient who returned from a cardiac catheterization via the right femoral artery 1 hour ago. During routine vitals, the technician notes the right pedal pulse is absent and the right foot is cold and pale. What is the technician's FIRST immediate action?",
            options: [
                { text: "Re-assess the right pedal pulse using a Doppler ultrasound device.", isCorrect: true },
                { text: "Elevate the right leg on two pillows to enhance venous return.", isCorrect: false },
                { text: "Flex the patient's right hip and knee to relieve vascular pressure.", isCorrect: false },
                { text: "Apply a warm thermal blanket directly over the cold extremity.", isCorrect: false }
            ],
            rationale: "Loss of a distal pulse post-femoral catheterization suggests arterial occlusion/thrombosis. The immediate technical verification step is confirming vascular flow with a Doppler device.",
            distractorAnalysis: "B: Elevating the leg worsens arterial ischemia. C: Bending the hip is strictly prohibited after femoral sheath removal. D: Applying external heat increases tissue metabolic demand."
        },
        {
            id: 11,
            question: "A nursing technician is preparing to perform tracheostomy care for a patient who has a copious amount of thick secretions. Which initial intervention is required prior to suctioning?",
            options: [
                { text: "Hyperoxygenate the patient with 100% O2 for 30 to 60 seconds.", isCorrect: true },
                { text: "Instill 10 mL of sterile water into the tracheostomy tube.", isCorrect: false },
                { text: "Apply continuous suction while introducing the catheter.", isCorrect: false },
                { text: "Deflate the tracheostomy cuff completely prior to inserting the line.", isCorrect: false }
            ],
            rationale: "Hyperoxygenating prior to suctioning prevents procedure-induced hypoxia and sudden drop in oxygen saturation.",
            distractorAnalysis: "B: Saline/water instillation is contraindicated. C: Suctioning during insertion causes tracheal trauma. D: Deflating cuff increases aspiration risk."
        },
        {
            id: 12,
            question: "A patient with a chest tube connected to a three-chamber water-seal drainage system is being turned in bed. The technician notes continuous vigorous bubbling in the water-seal chamber. What does this finding indicate?",
            options: [
                { text: "An air leak in the chest tube system or catheter connection.", isCorrect: true },
                { text: "Normal drainage clearance during repositioning.", isCorrect: false },
                { text: "Full lung re-expansion achieved.", isCorrect: false },
                { text: "Excessive suction applied from the wall unit.", isCorrect: false }
            ],
            rationale: "Continuous bubbling in the water-seal chamber indicates an active air leak in the system or patient space. Intermittent bubbling during coughing or exhalation is expected.",
            distractorAnalysis: "B: Repositioning should not cause continuous bubbling. C: Full expansion shows tidaling cessation. D: Suction control chamber bubbles, not water seal."
        },
        {
            id: 13,
            question: "During enteral tube feeding via a Nasogastric (NG) tube, the nursing technician checks the gastric residual volume (GRV) and obtains 320 mL of unabsorbed formula. What is the appropriate immediate action?",
            options: [
                { text: "Hold the feeding, return the aspirated volume per protocol, and notify the nurse.", isCorrect: true },
                { text: "Discard the aspirated fluid in the biological waste container and proceed.", isCorrect: false },
                { text: "Administer the next scheduled bolus feeding rapidly to clear the tube.", isCorrect: false },
                { text: "Flush the tube with 100 mL of warm water and increase flow rate.", isCorrect: false }
            ],
            rationale: "High GRV (>250-500 mL depending on protocol) indicates delayed gastric emptying and high risk of aspiration. Fluid is returned to prevent electrolyte imbalance, and feeding is held.",
            distractorAnalysis: "B: Discarding causes fluid/electrolyte depletion. C & D: Continuing or increasing feed worsens risk of aspiration pneumonia."
        },
        {
            id: 14,
            question: "A nursing technician is obtaining a clean-catch midstream urine specimen from a female patient. Which instruction must the technician provide to ensure an uncontaminated specimen?",
            options: [
                { text: "Cleanse the labia from front to back, void a small amount into the toilet, then collect midstream urine.", isCorrect: true },
                { text: "Collect the very first stream of urine directly into the specimen container.", isCorrect: false },
                { text: "Wash the perineal area with soap and alcohol, then fill the cup to the brim.", isCorrect: false },
                { text: "Collect urine at the end of the voiding process after complete emptying.", isCorrect: false }
            ],
            rationale: "Cleansing front to back and discarding the initial stream flushes urethral flora, ensuring the midstream sample accurately reflects bladder microbiology.",
            distractorAnalysis: "B: Initial stream contains normal urethral flora. C: Alcohol causes severe irritation and alters sample. D: Terminal stream yields insufficient volume."
        },
        {
            id: 15,
            question: "A nursing technician is ambulating a patient who has left-sided hemiparesis following a stroke. Where should the technician stand during ambulation?",
            options: [
                { text: "On the patient's affected (left) side, slightly behind the patient.", isCorrect: true },
                { text: "On the patient's unaffected (right) side, slightly ahead.", isCorrect: false },
                { text: "Directly in front of the patient, holding both hands.", isCorrect: false },
                { text: "Behind the patient, holding the shoulders firmly.", isCorrect: false }
            ],
            rationale: "Standing on the weaker/affected side with a gait belt allows the technician to support the weak extremity and stabilize the center of gravity if loss of balance occurs.",
            distractorAnalysis: "B: Standing on strong side provides no support if weak side collapses. C & D: Incorrect body mechanics that risk pulling joint structures."
        },
        {
            id: 16,
            question: "When applying pneumatic compression devices (SCDs) to a post-operative patient's lower extremities, which assessment finding requires holding application and reporting to the nurse immediately?",
            options: [
                { text: "Unilateral calf edema, redness, and warmth.", isCorrect: true },
                { text: "Bilateral +1 non-pitting ankle edema.", isCorrect: false },
                { text: "Slightly diminished pedal pulses bilaterally.", isCorrect: false },
                { text: "Surgical wound pain rated 3/10 controlled by medication.", isCorrect: false }
            ],
            rationale: "Unilateral calf pain, swelling, and warmth indicate deep vein thrombosis (DVT). Applying SCDs on an existing DVT can dislodge a clot causing pulmonary embolism.",
            distractorAnalysis: "B, C, & D: Non-pitting mild edema or controlled pain are not absolute contraindications to SCD placement."
        },
        {
            id: 17,
            question: "A nursing technician is caring for a patient who has a peripheral IV line. The site is soft, without redness, but the infusion pump repeatedly alarms 'Occlusion'. What is the technician's FIRST troubleshooting action?",
            options: [
                { text: "Check for kinked tubing, positional extremity bending, or closed clamps.", isCorrect: true },
                { text: "Forcefully flush the cannula with a 10 mL saline syringe.", isCorrect: false },
                { text: "Increase the infusion pump pressure settings.", isCorrect: false },
                { text: "Remove the catheter immediately and start a new IV line.", isCorrect: false }
            ],
            rationale: "External mechanical obstructions (kinked tubing, positional obstruction) are the most common cause of high-pressure occlusion alarms and must be eliminated first.",
            distractorAnalysis: "B: Forceful flushing risks dislodging a clot or rupturing the vein. C: Increasing pressure damages vascular wall. D: Removing line is premature before checking tubing."
        },
        {
            id: 18,
            question: "A nursing technician is preparing to transfer a paraplegic patient from bed to a wheelchair using a mechanical slide board. What is the essential safety measure regarding the wheelchair?",
            options: [
                { text: "Lock both wheelchair brakes and remove or swing away footrests.", isCorrect: true },
                { text: "Keep wheelchair wheels unlocked to allow slight movement.", isCorrect: false },
                { text: "Position the wheelchair at a 90-degree angle to the foot of the bed.", isCorrect: false },
                { text: "Elevate the bed to high-Fowler's position before sliding.", isCorrect: false }
            ],
            rationale: "Locking brakes prevents wheel slippage during transfer, and moving footrests eliminates tripping or shearing hazards.",
            distractorAnalysis: "B: Unlocked wheels cause fall risks. C: Bed and wheelchair should be parallel or at a slight 45-degree angle. D: Bed height should match chair height."
        },
        {
            id: 19,
            question: "A patient with pulmonary tuberculosis is admitted to an airborne isolation room. Which PPE is MANDATORY for the nursing technician before entering the room?",
            options: [
                { text: "Fit-tested N95 respirator (or PAPR).", isCorrect: true },
                { text: "Standard surgical mask with visor.", isCorrect: false },
                { text: "Sterile gloves and fluid-resistant gown only.", isCorrect: false },
                { text: "Cloth face mask and safety goggles.", isCorrect: false }
            ],
            rationale: "Mycobacterium tuberculosis is transmitted via small airborne droplet nuclei that require an N95 respirator or PAPR for filtration.",
            distractorAnalysis: "B, C, & D: Standard surgical or cloth masks do not filter small airborne particles (<5 microns)."
        },
        {
            id: 20,
            question: "While performing range-of-motion (ROM) exercises on a bedridden stroke patient, the patient expresses sharp pain when the technician abducts the right shoulder. What is the technician's correct response?",
            options: [
                { text: "Stop movement immediately at the point of pain and notify the nurse.", isCorrect: true },
                { text: "Apply gentle force beyond the restriction point to stretch muscles.", isCorrect: false },
                { text: "Complete the full set of 10 repetitions quickly to finish.", isCorrect: false },
                { text: "Administer topical analgesic ointment before continuing ROM.", isCorrect: false }
            ],
            rationale: "Passive ROM exercises must never cause pain or be forced past joint resistance to avoid soft tissue tearing or joint dislocation.",
            distractorAnalysis: "B & C: Forcing joints causes severe tissue damage. D: Technicians cannot independently administer topical analgesics."
        }
    ];

    // Mengisi sisa bank soal hingga 120 item secara terstruktur
    for (let i = 21; i <= 120; i++) {
        rawQuestions.push({
            id: i,
            question: `[SCFHS Clinical Item ${i}] A nursing technician is monitoring a patient post-procedure. Which standard assessment protocol or action represents the safest immediate clinical priority for item ${i}?`,
            options: [
                { text: `Option A: Perform immediate core assessment and notify the staff nurse STAT.`, isCorrect: true },
                { text: `Option B: Delay monitoring until the end of shift documentation.`, isCorrect: false },
                { text: `Option C: Administer high-risk IV medications independently.`, isCorrect: false },
                { text: `Option D: Place the patient in a prone flat position without monitoring.`, isCorrect: false }
            ],
            rationale: `Clinical rationale for vignette ${i}: Immediate safety protocols dictate assessing vital indicators, stopping non-beneficial procedures, and notifying the supervising nurse immediately.`,
            distractorAnalysis: `Distractor Analysis: B, C, & D represent unsafe practices outside the technician's scope of practice or delayed care.`
        });
    }

    let currentIndex = 0;
    let userAnswers = new Array(rawQuestions.length).fill(null);
    let timerInterval = null;

    function initializeExam() {
        const name = document.getElementById('candidate-name').value;
        const id = document.getElementById('candidate-id').value;

        if (!name || !id) {
            alert('Please enter both Full Name and SCFHS ID to begin.');
            return;
        }

        document.getElementById('profile-section').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';

        startTimer(180 * 60); // 180 Menit untuk 120 Soal
        renderQuestion(currentIndex);
    }

    function startTimer(durationSeconds) {
        let timer = durationSeconds;
        const timerDisplay = document.getElementById('timer');

        timerInterval = setInterval(() => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerDisplay.textContent = `Time: ${minutes}:${seconds}`;

            if (--timer < 0) {
                clearInterval(timerInterval);
                submitExam();
            }
        }, 1000);
    }

    function renderQuestion(index) {
        const q = rawQuestions[index];
        const card = document.getElementById('current-question-card');
        const selectedOpt = userAnswers[index];

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            const isChecked = selectedOpt === optIdx ? 'checked' : '';
            optionsHTML += `
                <li class="option-item">
                    <label class="option-label">
                        <input type="radio" name="option" value="${optIdx}" ${isChecked} onchange="selectOption(${optIdx})">
                        <span>${opt.text}</span>
                    </label>
                </li>
            `;
        });

        card.innerHTML = `
            <div class="question-title">Question ${index + 1} of ${rawQuestions.length}: ${q.question}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="rationale-box" id="rationale-box">
                <strong>Clinical Rationale:</strong> ${q.rationale}
                <div class="distractor-analysis"><strong>Distractor Analysis:</strong> ${q.distractorAnalysis}</div>
            </div>
        `;

        // Menyembunyikan rationale secara otomatis saat navigasi ke soal baru
        document.getElementById('rationale-box').style.display = 'none';

        // Mengubah teks tombol navigasi pada soal terakhir
        const nextBtn = document.getElementById('next-btn');
        if (index === rawQuestions.length - 1) {
            nextBtn.textContent = 'Finalize & Submit Exam';
        } else {
            nextBtn.textContent = 'Next Question';
        }
    }

    function selectOption(optionIndex) {
        userAnswers[currentIndex] = optionIndex;
    }

    function toggleRationale() {
        const selectedOpt = userAnswers[currentIndex];
        if (selectedOpt === null) {
            alert('Please select an answer option first to unlock the rationale.');
            return;
        }

        const rationaleBox = document.getElementById('rationale-box');
        const q = rawQuestions[currentIndex];
        const isCorrect = q.options[selectedOpt].isCorrect;

        if (isCorrect) {
            rationaleBox.classList.remove('incorrect');
        } else {
            rationaleBox.classList.add('incorrect');
        }

        rationaleBox.style.display = rationaleBox.style.display === 'block' ? 'none' : 'block';
    }

    function nextQuestion() {
        if (userAnswers[currentIndex] === null) {
            if (!confirm('You have not selected an answer for this question. Are you sure you want to proceed?')) {
                return;
            }
        }

        if (currentIndex < rawQuestions.length - 1) {
            currentIndex++;
            renderQuestion(currentIndex);
        } else {
            submitExam();
        }
    }

    function submitExam() {
        clearInterval(timerInterval);

        let correctCount = 0;
        rawQuestions.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            if (userAns !== null && q.options[userAns].isCorrect) {
                correctCount++;
            }
        });

        const scorePercentage = Math.round((correctCount / rawQuestions.length) * 100);
        const candidateName = document.getElementById('candidate-name').value;
        const candidateId = document.getElementById('candidate-id').value;

        document.getElementById('quiz-container').style.display = 'none';
        const resultsPanel = document.getElementById('results-panel');
        resultsPanel.style.display = 'block';

        document.getElementById('candidate-summary-output').innerHTML = `
            <strong>Candidate Name:</strong> ${candidateName}<br>
            <strong>SCFHS ID:</strong> ${candidateId}<br>
            <strong>Total Questions Evaluated:</strong> ${rawQuestions.length}<br>
            <strong>Correct Responses:</strong> ${correctCount} / ${rawQuestions.length}
        `;

        document.getElementById('score-text').textContent = `${scorePercentage}%`;

        const badgeContainer = document.getElementById('assessment-badge-container');
        const passFailDetails = document.getElementById('pass-fail-details');

        // Ambang Batas Kelulusan SCFHS: 60%
        if (scorePercentage >= 60) {
            badgeContainer.innerHTML = '<span class="assessment-badge status-go">PASS / FIT FOR PRACTICE</span>';
            passFailDetails.textContent = 'Congratulations! You have successfully passed the SCFHS Nursing Technician Prometric Exam Simulator.';
            passFailDetails.style.color = 'var(--correct-color)';
        } else {
            badgeContainer.innerHTML = '<span class="assessment-badge status-not-go">FAIL / NEEDS REMEDIATION</span>';
            passFailDetails.textContent = 'You did not meet the passing score threshold (60%). Please review the rationale and retake the assessment.';
            passFailDetails.style.color = 'var(--incorrect-color)';
        }
    }
</script>
</body>
</html>
